<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jogo de IA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="caixa-principal">

        <h1>🤖 IA: O Futuro Começou</h1>

        <p class="subtitulo">
            Faça suas escolhas e descubra qual futuro você irá construir.
        </p>

        <div class="progresso">
            <div id="barra-progresso"></div>
        </div>

        <section class="caixa-jogo">

            <div class="caixa-perguntas">
                <h2 id="pergunta"></h2>
            </div>

            <div class="caixa-alternativas" id="alternativas"></div>

            <div class="caixa-resultado" id="resultado">

                <h2>🌎 Em 2049...</h2>

                <p id="texto-resultado"></p>

                <button id="novamente-btn">
                    🔄 Jogar novamente
                </button>

            </div>

        </section>

        <p class="rodape">
            Suas escolhas mudam a história.
        </p>

    </main>

    <script src="script.js"></script>

</body>

</html>
